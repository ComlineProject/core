# The additions made to format 3 without a bump, one row per addition, in the
# order they were made (core#268, docs/proposals/ir-migrations/formats.md).
#
# id        "3.<n>": how SCHEMA.md and a fixture name the row
# commit    where it was added; the rows from before this file are the
#           commits that added them to `master`
# date      when
# added     what was added
# absent    what a version written before it reads as: the absence reading
# fixture   (optional) the store under tests/migrations/stores/format-3/ that
#           has the row. None yet: the first fixtures are built for the step
#           out of format 3, and `cargo xtask check-format-bump` requires one
#           per row before format 4 can be introduced.
#
# A row is added in the same change as the lines in types.rs and SCHEMA.md
# that carry it, and never removed. The first twenty are what format 3 had
# gained when the gate was written; the last two are the entries that
# nothing writes yet.

