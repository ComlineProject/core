[package]
name = "comline-core-fuzz"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# cargo-fuzz targets for the `.ids` and `.idp` parsers and the schema
# compiler behind them. Outside the workspace: they need nightly,
# `cargo +nightly fuzz run --fuzz-dir core/fuzz <target>`. See README.md.

# Its own workspace, so the core workspace never builds it.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `deps`: the unverified_oracle target builds graphs of packages, which
# resolves their dependencies.
comline-core = { path = "..", features = ["deps"] }
# The oracle and the graphs it is checked over (core#223); no dependency on core.
comline-core-oracle = { path = "../oracle", features = ["arbitrary"] }
tempfile = "3.8"

[[bin]]
name = "ids_parse"
path = "fuzz_targets/ids_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ids_compile"
path = "fuzz_targets/ids_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "idp_parse"
path = "fuzz_targets/idp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unverified_oracle"
path = "fuzz_targets/unverified_oracle.rs"
test = false
doc = false
bench = false
