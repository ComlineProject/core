[package]
name = "comline-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Core library and compiler for Comline, an IDL for versioned communication schemas"
repository = "https://github.com/ComlineProject/core"
homepage = "https://github.com/ComlineProject"
readme = "README.md"
keywords = ["idl", "schema", "codegen", "compiler", "versioning"]
categories = ["compilers", "development-tools", "parser-implementations"]
# Dependency-driven (indexmap, tree-sitter-generate via rust-sitter-tool);
# comline-core's own code builds on older. Verified with `cargo +1.82.0 check`.
rust-version = "1.82"
# Keep test/example/bench sources in the package (they resolve target
# auto-discovery cleanly); only drop the generated Criterion report + helper.
exclude = ["benches/benchmark_results.html", "benches/run_bench.sh"]


[dependencies]
# The embedded standard library (`use std::…`)
comline-core-stdlib = { path = "../core_stdlib", version = "0.1.0" }

# General
eyre = "0.6.8"
snafu = { version = "0.7.5", optional = true }
once_cell = { version = "1.17.1", optional = true }
downcast-rs = { version = "1.2.0", optional = true }
glob = { version = "0.3.1", optional = true }
regex = { version = "1.9.3", optional = true }
#num-traits = "0.2.16"
#num-derive = "0.4.0"
semver = "1.0.18"
tracing = "0.1"

# Serialization
serde = "1.0.164"
serde_derive = "1.0.164"

# Lexing, Parsing
# The parser and what only the compiler uses are optional, behind `compiler`
rust-sitter = { version = "0.4.5", optional = true }                       # Pure Rust incremental parser with tree-sitter
chumsky = { version = "0.9.2", optional = true }                           # Kept for potential error recovery helpers
ariadne = { version = "0.3.0", features = ["auto-color"], optional = true } # Error reporting
serde_json = "1"                                            # Encoding profiles (JSON)
ciborium = "0.2"                                            # Name-tagged binary serialization for CAS (not position-based like bincode)

toml_edit = { version = "0.21.0", optional = true }
handlebars = { version = "4.3.7", optional = true }

# Hashing
blake3 = "1.4.1"
lz4_flex = "0.11.1"

[features]
default = ["compiler"]
# The parser (rust-sitter / tree-sitter), the `.ids`/`.idp` grammars, and
# everything built on them: compiling, validating, diffing and building
# packages. On by default. Without it (`default-features = false`) the crate
# is the IR alone: the frozen schema and config units, the CBOR helpers and
# the IR format stamp, the annotation names, `unverified` - what a generator
# reads. That build has no tree-sitter in it, so it compiles for
# `wasm32-wasip1` and `wasm32-unknown-unknown` (tree-sitter-c2rust doesn't
# build for WASI). Module paths are the same either way.
compiler = [
    "dep:rust-sitter", "dep:rust-sitter-tool", "dep:chumsky", "dep:ariadne",
    "dep:snafu", "dep:once_cell", "dep:downcast-rs", "dep:glob", "dep:regex",
    "dep:toml_edit", "dep:handlebars",
]
# Dependency resolution: fetches Path/Git dependencies and vendors them into
# the CAS. Not part of `default` — it's CLI-only functionality (only a native
# build that actually runs `comline build`/`check` needs it) and keeps every
# other consumer's dependency tree exactly as it is today.
deps = ["compiler"]

[build-dependencies]
rust-sitter-tool = { version = "0.4.5", optional = true } # Build-time grammar compilation (`compiler`)

[dev-dependencies]
pretty_assertions = "1.4.0"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "parser_benchmark"
harness = false
