name: Benchmarks
# The parser benches, two metrics over the same inputs (core/benches/inputs/):
#
# - instructions: iai-callgrind (core/benches/parser_instructions.rs). On a
#   pull request it's the gate: the base and then the head, benched in the
#   same job on the same machine. Instruction counts are deterministic, so a
#   fine limit holds without flaking. The comparison goes to the job summary.
# - wall time: Criterion (core/benches/parser_benchmark.rs), run once on the
#   head for the report. Never gated: wall time on shared runners is noise.
#
# Both land in `core.bench.json` (the Observatory's bench format 2), written
# by .github/scripts/bench-report.py; on a pull request it's an artifact.
#
# The jobs are the shared reusable workflow's (ComlineProject/.github,
# bench.yml), run in the bench CI image (valgrind and iai-callgrind-runner in
# it, nothing installed here; the container's default options lift the seccomp
# profile valgrind needs). What is core's is the report script, the ledger and
# the inputs below.
#
# Accepting a regression: a benchmark that grows past the limit fails, unless
# the pull request appends an `[[accepted]]` entry for it to the ledger,
# core/benches/accepted-regressions.toml, naming the benchmark, the most it
# may grow, and why. Likewise a benchmark the base had and the head doesn't
# run fails, unless the pull request appends a `[[removed]]` entry; one with
# `renamed_to` is compared under its new id against its old count. A new
# benchmark has nothing to regress from, and is recorded only, as is
# everything when the base has no instruction-count bench at all. Entries
# count only in the pull request that adds them (`pr` must be its number);
# see the ledger's header. Nothing is accepted by a label, a setting or a
# default.
#
# Plain `pull_request`, not `pull_request_target`: a fork's pull request runs
# with a read-only token and no secrets.
#
# Publishing: on every push to `master` (and a manual run), the publish job
# benches the head alone (nothing to gate) and commits `core.bench.json` to
# the `reports` branch with the Observatory's publish-report action. Only
# that job can write, and only from `master`: a manual run from another
# branch does a dry run of the publish.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes this run; a branch's runs
# (the publish) queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    name: bench
    # `contents: write` is the ceiling for the reusable workflow's publish job,
    # the only one that asks for it, and it never runs on a pull request.
    permissions:
      contents: write
    uses: ComlineProject/.github/.github/workflows/bench.yml@797d473553d7f2fc50895bb2573acb83ac63c7cb # main, no release tag yet
    with:
      image: ghcr.io/comlineproject/ci-bench@sha256:235555448c3c6027960cd95c0b2974014484e0c4f2808f064eb4cb3df91cebc0
      ledger: core/benches/accepted-regressions.toml
      report-path: reports/core.bench.json
      # A benchmark fails when its instruction count grows by more than this
      # many percent, unless the ledger accepts it (see the top). With one
      # codegen unit (`[profile.bench]` in Cargo.toml) a change to one
      # function leaves the others' counts alone.
      limit-percent: '1'
      wall-time-command: cargo bench -p comline-core --bench parser_benchmark
      publish: true
      default-branch: master
