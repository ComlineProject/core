name: Cargo Build & Test

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes this run; a branch's runs
# queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The toolchain matrix (stable, beta, nightly), the same build and tests on
  # the other platforms (core#9: paths and line endings are where they're
  # expected to differ), and a stable canary on ubuntu-26.04 that may fail
  # without failing the run. The reusable workflow's own jobs set the runner,
  # the timeouts and the pinned actions.
  rust:
    name: rust
    permissions:
      contents: read
    uses: ComlineProject/.github/.github/workflows/rust-ci.yml@6bfbbcc9bccd25b44c06dbf41408885bb29aafe6 # main, no release tag yet
    with:
      # Dependency resolution is behind `deps` (the CLI turns it on), and so
      # are its tests.
      features: deps
      features-package: comline-core

  # The size vectors the sizer is tested against and the compiler cases the
  # build is (core/tests/spec) are the specification's own, at the rev
  # `comline-catalog` is pinned to.
  spec_vectors:
    name: Vendored specification files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash core/tests/spec/vendor.sh --check

  # The IR alone (`default-features = false`): what a generator depends on.
  # It has no parser, so unlike the default build it compiles for WASI and
  # the browser; this keeps tree-sitter (and anything else that can't) out.
  # In the wasm CI image (stable 1.99.1, which `rust-toolchain.toml` pins, and
  # the browser target); the WASI target is not in it, so it is added here.
  ir_only:
    name: IR only (no default features)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/comlineproject/ci-wasm@sha256:742fbab34886e53d099c7faee9ffa9cd9c53cda085f8139eb112106f9be1e0e5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-wasip1 wasm32-unknown-unknown
      - run: cargo build --verbose -p comline-core --no-default-features
      - run: cargo test --verbose -p comline-core --no-default-features --lib
      - run: cargo build --verbose -p comline-core --no-default-features --target wasm32-wasip1
      - run: cargo build --verbose -p comline-core --no-default-features --target wasm32-unknown-unknown
